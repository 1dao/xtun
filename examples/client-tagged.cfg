# Replace documentation addresses with the real servers' numeric IPv4 addresses.
# Commented fields are optional; omit them to use the stated defaults.
# Optional: groups are inferred from prefixes in first-occurrence order.
# Uncomment to explicitly select and order the available groups.
# tags=work,personal

# Optional display label; defaults to the tag name.
# work.label=Work tunnel
work.endpoint=192.0.2.2
# Optional; omit to use the default: 51215.
# work.port=51215
# Optional; omit to use the default: xtun_client.
# work.identity=xtun_client
work.psk=
# Optional; omit to use the default: xtun0.
# work.name=xtun0
# Windows default: true (global IPv4 tunnel); Linux default: false.
# Set false explicitly before enabling the routes example below.
# work.full_tunnel=true
work.address=10.77.0.2
work.peer_address=10.77.0.1
# Split mode only (full_tunnel=false): add these routes alongside the tunnel peer route.
# work.routes=198.19.0.0/24

# Optional display label; defaults to the tag name.
# personal.label=Personal tunnel
personal.endpoint=203.0.113.9
# Optional; omit to use the default: 51215.
# personal.port=51215
# Optional; omit to use the default: xtun_client.
# personal.identity=xtun_client
personal.psk=
# Optional; omit to use the default: xtun0.
# personal.name=xtun0
# Windows default: true (global IPv4 tunnel); Linux default: false.
# Set false explicitly before enabling the routes example below.
# personal.full_tunnel=true
personal.address=10.78.0.2
personal.peer_address=10.78.0.1
