# XTun IPv4 server configuration
# Commented fields are optional; omit them to use the stated defaults.
# Optional; omit to use the default: 0.0.0.0.
# bind=0.0.0.0
# Optional; omit to use the default: 51215.
# port=51215
# Optional; omit to use the default: xtun_client.
# identity=xtun_client
psk=
# Optional; omit to use the default: xtun0.
# name=xtun0
address=10.77.0.1
peer_address=10.77.0.2
# Optional extra allowed destinations; by default only the local tunnel address is allowed.
# local_networks=198.19.0.0/24

# For a full tunnel, set local_networks=0.0.0.0/0 and enable IPv4 forwarding.
# Optional Linux gateway hooks. Verify eth0 is the outbound interface first.
# Idempotent: PostUp checks before adding, PostDown removes every copy, so
# restarting never accumulates duplicate rules.
# PostUp=iptables -C FORWARD -i xtun0 -o eth0 -s 10.77.0.2/32 -m comment --comment xtun-hook-51215 -j ACCEPT 2>/dev/null || iptables -A FORWARD -i xtun0 -o eth0 -s 10.77.0.2/32 -m comment --comment xtun-hook-51215 -j ACCEPT; iptables -C FORWARD -i eth0 -o xtun0 -d 10.77.0.2/32 -m conntrack --ctstate ESTABLISHED,RELATED -m comment --comment xtun-hook-51215 -j ACCEPT 2>/dev/null || iptables -A FORWARD -i eth0 -o xtun0 -d 10.77.0.2/32 -m conntrack --ctstate ESTABLISHED,RELATED -m comment --comment xtun-hook-51215 -j ACCEPT; iptables -t nat -C POSTROUTING -o eth0 -s 10.77.0.2/32 -m comment --comment xtun-hook-51215 -j MASQUERADE 2>/dev/null || iptables -t nat -A POSTROUTING -o eth0 -s 10.77.0.2/32 -m comment --comment xtun-hook-51215 -j MASQUERADE
# PostDown=rc=0; iptables -t nat -S POSTROUTING >/dev/null 2>&1 || rc=1; while iptables -t nat -D POSTROUTING -o eth0 -s 10.77.0.2/32 -m comment --comment xtun-hook-51215 -j MASQUERADE 2>/dev/null; do :; done; while iptables -D FORWARD -i eth0 -o xtun0 -d 10.77.0.2/32 -m conntrack --ctstate ESTABLISHED,RELATED -m comment --comment xtun-hook-51215 -j ACCEPT 2>/dev/null; do :; done; while iptables -D FORWARD -i xtun0 -o eth0 -s 10.77.0.2/32 -m comment --comment xtun-hook-51215 -j ACCEPT 2>/dev/null; do :; done; exit "$rc"
